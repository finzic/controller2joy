; Build with PlatformIO:   pio run -e d1_mini -t upload
; Arduino IDE users: open controller2joy/controller2joy.ino and install
; "USB Host Shield Library 2.0" from the Library Manager.

[platformio]
src_dir = controller2joy
default_envs = d1_mini

[env]
framework = arduino
lib_deps = felis/USB-Host-Shield-20@^1.6.0
monitor_speed = 115200

[env:d1_mini]
platform = espressif8266
board = d1_mini

[env:esp32dev]
platform = espressif32
board = esp32dev
